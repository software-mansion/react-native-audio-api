pre-commit:
  parallel: true
  commands:
    format_check:
      run: yarn format:check
    lint:
      run: yarn lint
    types:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn typecheck
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
pre-push:
  commands:
    validate_fast:
      run: yarn validate:fast
