name: Docs
on:
  pull_request:
    paths:
      - 'packages/audiodocs/**'

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Yarn
        uses: mskelton/setup-yarn@v2

      - name: Install dependencies and build the docs
        run: |
          cd packages/audiodocs
          yarn install --frozen-lockfile
          yarn build

      - name: Check docs llms.txt
        run: |
          file=packages/audiodocs/build/llms.txt
          if [ ! -s "$file" ]; then
            echo "::error::$file is missing or empty"
            exit 1
          fi
          count=$(grep -cE '^- \[[^]]+\]\(https://docs\.swmansion\.com/react-native-audio-api/[^)]+\)' "$file" || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::$file lists no pages"
            exit 1
          fi
          echo "llms.txt lists $count pages"