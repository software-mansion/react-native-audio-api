name: Docs
on:
  pull_request:
    paths:
      - 'packages/audiodocs/**'
      - 'packages/docs-theme/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup-env
        with:
          install-args: --filter audiodocs...

      - name: Build the docs
        run: pnpm --filter audiodocs build

      - name: Check docs llms.txt
        run: |
          file=packages/audiodocs/build/llms.txt
          if [ ! -s "$file" ]; then
            echo "::error::$file is missing or empty"
            exit 1
          fi
          count=$(grep -cE '^- \[[^]]+\]\(https://docs\.swmansion\.com/react-native-audio-api/[^)]+\)' "$file" || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::$file lists no pages"
            exit 1
          fi
          echo "llms.txt lists $count pages"