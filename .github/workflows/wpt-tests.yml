name: WPT tests

on:
  workflow_call:

jobs:
  wpt-run:
    name: Run (${{ matrix.side }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
    steps:
      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.side }}" = "base" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            else
              echo "ref=main" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      # Inline steps, not ./.github/actions/setup-env: the base side checks out the base
      # branch, which may not have that action or may have an older version of it.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.x'

      - name: Run WPT CI report
        working-directory: packages/react-native-audio-api
        shell: bash
        run: |
          set -euo pipefail
          REPORT_PATH="./wpt_tests/results/latest.json"
          mkdir -p ./wpt_tests/results

          # Prefer the dedicated script when present (head / post-merge).
          # Fall back for older base revisions that lack wpt:ci-report / --allow-failures.
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['wpt:ci-report'] ? 0 : 1)"; then
            pnpm wpt:ci-report
          else
            pnpm wpt:build
            set +e
            node ./wpt_tests/wpt/wpt-harness.mjs --report-json "$REPORT_PATH"
            set -e
          fi

          test -f "$REPORT_PATH"

      - name: Upload WPT report
        uses: actions/upload-artifact@v7
        with:
          name: wpt-${{ matrix.side }}
          path: packages/react-native-audio-api/wpt_tests/results/latest.json
          if-no-files-found: error

  wpt-compare:
    name: Compare
    # Runs even when wpt-run failed, so the report can say why.
    if: ${{ !cancelled() }}
    needs: wpt-run
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup-env
        with:
          install: 'false'

      - name: Download base report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: wpt-base
          path: wpt-reports/base

      - name: Download head report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: wpt-head
          path: wpt-reports/head

      - name: Compare WPT results
        id: compare
        # A regression still uploads the report; the last step fails the job.
        continue-on-error: true
        working-directory: packages/react-native-audio-api
        run: >
          node ./wpt_tests/wpt/wpt-compare.mjs
          --baseline ../../wpt-reports/base/latest.json
          --candidate ../../wpt-reports/head/latest.json
          --markdown-out ../../pr-report/wpt/report.md
          --baseline-label "${{ github.event.pull_request.base.sha || 'main' }}"
          --candidate-label "${{ github.event.pull_request.head.sha || github.sha }}"

      # Reports an error when the comparison produced no report.
      - name: Write the fallback report
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pr-report/wpt
          if [ ! -s pr-report/wpt/report.md ]; then
            {
              echo '## WPT non-regression comparison'
              echo
              echo '**ERROR**: the comparison produced no report, so the test run itself likely failed.'
            } > pr-report/wpt/report.md
          fi

      - name: Upload the report
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/upload-pr-report
        with:
          name: wpt
          path: pr-report

      - name: Fail on WPT regression
        if: steps.compare.outcome != 'success' || needs.wpt-run.result != 'success'
        run: exit 1
