name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  cpp-tests:
    uses: ./.github/workflows/cpp-job.yml
    with:
      name: C++ tests
      working-directory: packages/react-native-audio-api
      run: bash common/cpp/test/RunTests.sh

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Run JS integration tests
        working-directory: packages/react-native-audio-api
        run: yarn build && yarn test:js
