name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  # Runs on main fill the caches that pull requests read from.
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    # Outside pull requests every package runs.
    outputs:
      # A change to shared files (CI, toolchain, root config) runs every test suite.
      shared: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' }}
      audio-api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.audio-api == 'true' }}
      worklets: ${{ github.event_name != 'pull_request' || steps.filter.outputs.worklets == 'true' }}
      audiodocs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.audiodocs == 'true' }}
      internaldocs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.internaldocs == 'true' }}
      fabric-example: ${{ github.event_name != 'pull_request' || steps.filter.outputs.fabric-example == 'true' }}
    steps:
      # A package's filter includes the filters of the workspace packages it depends on.
      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - 'tsconfig.json'
              - '.eslintrc.js'
              - 'prettier.config.js'
              - 'scripts/run-steps.sh'
              - '.github/actions/setup-env/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/check-package.yml'
            audio-api: &audio-api
              - *shared
              - 'packages/react-native-audio-api/**'
            worklets: &worklets
              - *audio-api
              - 'packages/react-native-audio-worklets/**'
            docs-theme: &docs-theme
              - 'packages/docs-theme/**'
            audiodocs:
              - *shared
              - *docs-theme
              - 'packages/audiodocs/**'
            internaldocs:
              - *shared
              - *docs-theme
              - 'packages/internaldocs/**'
            fabric-example:
              - *worklets
              - 'apps/common-app/**'
              - 'apps/fabric-example/**'

  react-native-audio-api:
    needs: changes
    if: needs.changes.outputs.audio-api == 'true'
    uses: ./.github/workflows/check-package.yml
    with:
      directory: packages/react-native-audio-api
      test-all: ${{ needs.changes.outputs.shared == 'true' }}

  react-native-audio-worklets:
    needs: changes
    if: needs.changes.outputs.worklets == 'true'
    uses: ./.github/workflows/check-package.yml
    with:
      directory: packages/react-native-audio-worklets
      test-all: ${{ needs.changes.outputs.shared == 'true' }}

  audiodocs:
    needs: changes
    if: needs.changes.outputs.audiodocs == 'true'
    uses: ./.github/workflows/check-package.yml
    with:
      directory: packages/audiodocs
      test-all: ${{ needs.changes.outputs.shared == 'true' }}

  internaldocs:
    needs: changes
    if: needs.changes.outputs.internaldocs == 'true'
    uses: ./.github/workflows/check-package.yml
    with:
      directory: packages/internaldocs
      test-all: ${{ needs.changes.outputs.shared == 'true' }}

  fabric-example:
    needs: changes
    if: needs.changes.outputs.fabric-example == 'true'
    uses: ./.github/workflows/check-package.yml
    with:
      directory: apps/fabric-example
      test-all: ${{ needs.changes.outputs.shared == 'true' }}

  gate:
    name: Gate
    if: always()
    needs:
      - changes
      - react-native-audio-api
      - react-native-audio-worklets
      - audiodocs
      - internaldocs
      - fabric-example
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
