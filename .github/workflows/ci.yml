name: CI
on:
  pull_request:
    branches:
      - main
      - 'release/**'
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types:
      - checks_requested

jobs:
  format-check:
    uses: ./.github/workflows/ci-check.yml
    with:
      name: Format check
      run: pnpm format:check

  lint-audio-api:
    uses: ./.github/workflows/ci-check.yml
    with:
      name: Lint and typecheck (react-native-audio-api)
      run: |
        pnpm --filter react-native-audio-api lint
        pnpm --filter react-native-audio-api typecheck

  lint-worklets:
    uses: ./.github/workflows/ci-check.yml
    with:
      name: Lint and typecheck (react-native-audio-worklets)
      run: |
        pnpm --filter react-native-audio-api build
        pnpm --filter react-native-audio-worklets lint
        pnpm --filter react-native-audio-worklets typecheck

  check-audio-enum-sync:
    uses: ./.github/workflows/ci-check.yml
    with:
      name: Check enum sync
      run: pnpm check-audio-enum-sync

  build-audio-api:
    uses: ./.github/workflows/ci-check.yml
    with:
      name: Build (react-native-audio-api)
      run: pnpm --filter react-native-audio-api build

  build-worklets:
    uses: ./.github/workflows/ci-check.yml
    with:
      name: Build (react-native-audio-worklets)
      run: pnpm --filter react-native-audio-worklets build
