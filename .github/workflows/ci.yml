name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      all: ${{ steps.changes.outputs.all }}
      packages: ${{ steps.changes.outputs.packages }}
      # Native builds and WPT run on pull requests that need them and on manual runs,
      # not on pushes to main.
      android: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.changes.outputs.android == 'true') }}
      ios: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.changes.outputs.ios == 'true') }}
      wpt: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.changes.outputs.wpt == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The pull request merge commit and its base (scripts/base-ref.sh).
          fetch-depth: 2

      - name: Setup
        uses: ./.github/actions/setup-env
        with:
          install: 'false'

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changes="$(bash scripts/changes.sh)"
          else
            changes="$(bash scripts/changes.sh --all)"
          fi
          echo "$changes"
          for key in all android ios wpt; do
            echo "${key}=$(jq -r --arg key "$key" '.[$key]' <<<"$changes")" >> "$GITHUB_OUTPUT"
          done
          echo "packages=$(jq -c '.packages' <<<"$changes")" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.package.name }})
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    uses: ./.github/workflows/check-package.yml
    with:
      directory: ${{ matrix.package.directory }}
      test-all: ${{ needs.changes.outputs.all == 'true' }}

  native-build:
    name: Example app
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/native-build.yml
    with:
      android: ${{ needs.changes.outputs.android == 'true' }}
      ios: ${{ needs.changes.outputs.ios == 'true' }}

  wpt:
    name: WPT
    needs: changes
    if: needs.changes.outputs.wpt == 'true'
    uses: ./.github/workflows/wpt-tests.yml

  # Coverage only reports to pull requests.
  cpp-coverage:
    name: C++ coverage
    needs: changes
    if: github.event_name == 'pull_request' && contains(fromJSON(needs.changes.outputs.packages).*.name, 'react-native-audio-api')
    uses: ./.github/workflows/cpp-coverage.yml
    with:
      test-all: ${{ needs.changes.outputs.all == 'true' }}

  gate:
    name: Gate
    if: always()
    needs:
      - changes
      - package
      - native-build
      - wpt
      - cpp-coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
