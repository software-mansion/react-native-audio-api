name: WPT Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  wpt-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Initialize sparse WPT source
        working-directory: packages/react-native-audio-api
        run: yarn wpt:init

      - name: Build and run WPT smoke
        working-directory: packages/react-native-audio-api
        run: yarn wpt
