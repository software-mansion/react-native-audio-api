name: Internal docs

on:
  pull_request:
    paths:
      - 'packages/internaldocs/**'
      - 'packages/docs-theme/**'

jobs:
  build-internaldocs:
    name: Build internal docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Yarn
        uses: mskelton/setup-yarn@v2

      - name: Install dependencies and build
        run: |
          cd packages/internaldocs
          yarn install --immutable
          yarn build
