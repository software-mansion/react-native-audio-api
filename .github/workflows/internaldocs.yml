name: Internal docs

on:
  pull_request:
    paths:
      - 'packages/internaldocs/**'
      - 'packages/docs-theme/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  build-internaldocs:
    name: Build internal docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup-env
        with:
          install-args: --filter internaldocs...

      - name: Build
        run: pnpm --filter internaldocs build
