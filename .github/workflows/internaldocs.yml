name: Internal docs

on:
  pull_request:
    paths:
      - 'packages/internaldocs/**'
      - 'packages/docs-theme/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  build-internaldocs:
    name: Build internal docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter internaldocs...

      - name: Build
        run: pnpm --filter internaldocs build
