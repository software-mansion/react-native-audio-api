name: C++ Coverage Job

on:
  workflow_call:

jobs:
  run:
    name: C++ coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup-env
        with:
          tools: '["cmake", "llvm"]'

      - name: Run C++ coverage
        working-directory: packages/react-native-audio-api
        run: pnpm test:cpp:coverage

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v7
        with:
          name: cpp-coverage-html
          path: packages/react-native-audio-api/common/cpp/test/coverage-html
          retention-days: 14
