name: DOCS Build and publish audio api docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'software-mansion/react-native-audio-api'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter audiodocs...

      - name: Build the docs
        run: pnpm --filter audiodocs build

      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/audiodocs/build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Recrawl search index
        run: |
          curl -X POST https://crawler.algolia.com/api/1/crawlers/${{ secrets.CRAWLER_ID }}/reindex \
          -H "Content-Type: application/json" \
          -u ${{ secrets.CRAWLER_USER_ID }}:${{ secrets.CRAWLER_API_KEY }}

      - name: Deploy to Github Pages
        uses: actions/deploy-pages@v4
