name: Setup
description: Setup Node.js, lint tooling, and install dependencies

runs:
  using: composite
  steps:
    - name: Checkout with Node
      uses: ./.github/actions/checkout-with-node

    - name: Setup CMake
      uses: ./.github/actions/setup-cmake

    - name: Setup Python
      uses: actions/setup-python@v1

    - name: Install cpplint
      shell: bash
      run: pip install 'cpplint==2.0.2'

    - name: Install ktlint
      shell: bash
      run: |
        curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.7.0/ktlint
        chmod a+x ktlint
        sudo mv ktlint /usr/local/bin/

    - name: Install clang-format 23
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
        sudo apt-get install -y clang-format-23
        sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-23 200
        clang-format --version

    - name: Setup Yarn
      uses: ./.github/actions/setup-yarn
