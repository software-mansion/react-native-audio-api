name: Setup CMake
description: Install CMake for C++ builds

inputs:
  cmake-version:
    description: 'CMake version to install'
    required: false
    default: '4.0.x'

runs:
  using: composite
  steps:
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: ${{ inputs.cmake-version }}
