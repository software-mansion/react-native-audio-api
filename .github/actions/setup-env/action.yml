name: Setup environment
description: >
  Sets up Node and pnpm, installs the workspace dependencies and the tools a job asks for.
  Tool versions are pinned here, one line each.

inputs:
  tools:
    description: >
      JSON array of tools to install, e.g. '["cmake", "clang-format"]'.
      Known: cmake, ktlint, clang-format, clang-tidy, llvm (clang + llvm-cov), diff-cover.
      With cmake, CMake builds use Clang (CC=clang, CXX=clang++).
    required: false
    default: '[]'
  directory:
    description: >
      The workspace package the job is for, e.g. packages/react-native-audio-api. Keys the
      per-package caches (clang-tidy's clangd build directory).
    required: false
    default: ''
  install:
    description: Install the workspace dependencies ('false' sets up only Node and pnpm).
    required: false
    default: 'true'
  install-args:
    description: Extra arguments for `pnpm install`, e.g. '--filter audiodocs...'.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check requested tools
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        unknown=$(jq -r '.[] | select(IN("cmake", "ktlint", "clang-format", "clang-tidy", "llvm", "diff-cover") | not)' <<<"$TOOLS")
        if [ -n "$unknown" ]; then
          echo "::error::setup-env: unknown tools: $unknown"
          exit 1
        fi

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.install-args }}

    - name: Setup CMake
      if: contains(fromJSON(inputs.tools), 'cmake')
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.0.x'

    # Build C++ with Clang, as the NDK and Xcode do, not the runner's GCC.
    - name: Use Clang for CMake builds
      if: contains(fromJSON(inputs.tools), 'cmake')
      shell: bash
      run: |
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "CXX=clang++" >> "$GITHUB_ENV"

    - name: Install ktlint
      if: contains(fromJSON(inputs.tools), 'ktlint')
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL --retry 5 --retry-all-errors -o ktlint \
          https://github.com/pinterest/ktlint/releases/download/1.7.0/ktlint
        chmod a+x ktlint
        sudo mv ktlint /usr/local/bin/
        ktlint --version

    # Same LLVM release as Homebrew's llvm, so CI matches local runs.
    - name: Install LLVM 23 tools
      if: contains(fromJSON(inputs.tools), 'clang-format') || contains(fromJSON(inputs.tools), 'clang-tidy')
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
        for tool in clang-format clang-tidy; do
          if jq -e --arg tool "$tool" 'index($tool)' <<<"$TOOLS" >/dev/null; then
            sudo apt-get install -y "${tool}-23"
            sudo update-alternatives --install "/usr/bin/${tool}" "$tool" "/usr/bin/${tool}-23" 200
            "$tool" --version
          fi
        done

    # Saves the googletest download when clang-tidy re-configures the project.
    - name: Cache the clangd build directory
      if: contains(fromJSON(inputs.tools), 'clang-tidy') && inputs.directory != ''
      uses: actions/cache@v6
      with:
        path: ${{ inputs.directory }}/common/cpp/clangd/build
        key: clangd-${{ runner.os }}-${{ inputs.directory }}-${{ hashFiles(format('{0}/common/cpp/clangd/CMakeLists.txt', inputs.directory)) }}

    - name: Install diff-cover
      if: contains(fromJSON(inputs.tools), 'diff-cover')
      shell: bash
      run: pipx install 'diff-cover==11.0.1'

    - name: Install Clang and LLVM coverage tools
      if: contains(fromJSON(inputs.tools), 'llvm')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm
