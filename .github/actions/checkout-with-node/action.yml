name: Checkout with Node
description: Setup Node.js

inputs:
  node-version-file:
    description: 'File containing the Node.js version'
    required: false
    default: '.nvmrc'
  cache:
    description: 'Package manager to cache (e.g. yarn, npm). Leave empty to disable caching.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: ${{ inputs.cache }}
