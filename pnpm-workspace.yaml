packages:
  - packages/react-native-audio-api
  - packages/react-native-audio-worklets
  - packages/custom-node-generator
  - packages/audiodocs
  - packages/internaldocs
  - packages/docs-theme
  - packages/test-app-screen
  - apps/common-app
  - apps/fabric-example

# 1 Week gate
minimumReleaseAge: 10080

overrides:
  typescript: ~6.0.3
  # temporary until oxidation migration
  'react-native-audio-api-monorepo>@typescript-eslint/eslint-plugin': 8.58.1
  'react-native-audio-api-monorepo>@typescript-eslint/parser': 8.58.1
  # needed as swm/t-rex-ui pins docusaurus at 3.9.2 which is not compatible with webpack >=
  webpack: 5.101.3

catalog:
  '@babel/core': '^7.25.2'
  '@babel/preset-env': '^7.25.3'
  '@babel/runtime': '^7.25.0'
  '@commitlint/config-conventional': '17.0.2'
  '@evilmartians/lefthook': '^1.5.0'
  '@react-native-community/cli': '20.2.0'
  '@react-native-community/cli-platform-android': '20.2.0'
  '@react-native-community/cli-platform-ios': '20.2.0'
  '@react-native/babel-preset': '0.88.0'
  '@react-native/eslint-config': '0.88.0'
  '@react-native/metro-config': '0.88.0'
  '@react-native/typescript-config': '0.88.0'
  '@types/jest': '^29.5.13'
  '@types/react': '^19.2.0'
  '@types/react-test-renderer': '^19.1.0'
  '@types/semver': '7.7.1'
  commitlint: '17.0.2'
  eslint: '^8.57.0'
  eslint-config-prettier: '^9.0.0'
  eslint-plugin-prettier: '^5.0.1'
  eslint-plugin-react: '^7.34.3'
  jest: '^29.7.0'
  lucide-react-native: '^0.555.0'
  prettier: '^3.3.3'
  react: '19.3.0'
  react-dom: '19.3.0'
  react-native: '0.88.0'
  react-native-builder-bob: '0.33.1'
  react-native-reanimated: '4.7.1'
  react-native-svg: '15.15.4'
  react-native-worklets: '0.13.0'
  react-test-renderer: '19.3.0'
  typescript: '~6.0.3'

# Allow postinstall for git hooks registration
allowBuilds:
  '@evilmartians/lefthook': true
  esbuild: true
  core-js: false
  core-js-pure: false
