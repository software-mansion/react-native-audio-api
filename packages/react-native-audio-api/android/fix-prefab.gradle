// Ensures prefab publications include the built .so, not just headers.
// Ported from react-native-worklets/android/fix-prefab.gradle.kts.
//
// 1. Makes prefab*ConfigurePackage tasks depend on externalNativeBuild* so the
//    native library exists before prefab metadata is generated.
// 2. Touches dependent projects' prefab_config.json so their CMake glue is
//    regenerated with this library's .so in the link line.

tasks.configureEach { task ->
    def matcher = (task.name =~ /^prefab(.+)ConfigurePackage$/)
    if (matcher.matches()) {
        def variantName = matcher.group(1)
        task.outputs.upToDateWhen { false }
        task.dependsOn("externalNativeBuild${variantName}")
    }
}

afterEvaluate {
    def abis = reactNativeArchitectures()

    rootProject.allprojects.each { proj ->
        if (proj == rootProject) {
            return
        }

        def dependsOnThisLib = proj.configurations.any { config ->
            config.dependencies.any { dep ->
                (dep.group == project.group && dep.name == project.name) ||
                    dep.name == project.name
            }
        }
        if (!dependsOnThisLib && proj != project) {
            return
        }

        if (!proj.plugins.hasPlugin('com.android.application') &&
            !proj.plugins.hasPlugin('com.android.library')) {
            return
        }

        // Touch prefab_config.json in dependent native builds so AGP re-runs the
        // prefab CLI and emits a *Config.cmake that links libreact-native-audio-api.so.
        // See ExternalNativeJsonGenerator.kt in Android Gradle Plugin.
        def cxxDir = new File(proj.projectDir, '.cxx')
        if (!cxxDir.exists()) {
            return
        }

        cxxDir.eachDir { variantDir ->
            def randomDirs = variantDir.listFiles({ File f -> f.isDirectory() } as FileFilter)
            abis.each { abi ->
                randomDirs?.each { randomDir ->
                    def prefabFile = new File(randomDir, "${abi}/prefab_config.json")
                    if (prefabFile.exists()) {
                        prefabFile.setLastModified(System.currentTimeMillis())
                    }
                }
            }
        }
    }
}
