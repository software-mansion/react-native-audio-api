executionPrerequisite: FabricExample is running in the foreground on the target device
steps:
  - echo: Ensure Audio I/O Playground is open
  - when: { hidden: { id: log-clear } }
    steps:
      - tap: { text: Other }
      - await: { visible: { text: Audio I/O Playground } }
      - await: { idle: true }
      - tap: { text: Audio I/O Playground }
  - await: { visible: { id: log-clear } }
  - await: { idle: true }
