pluginManagement {
  // @react-native/gradle-plugin is a dependency of react-native, not of the app, so it is
  // resolved from react-native's location instead of a fixed node_modules path.
  // pluginManagement runs before the rest of this script, so it cannot share a variable with it.
  includeBuild(new File(["node", "--print",
      "require.resolve('@react-native/gradle-plugin/package.json', {paths: [require.resolve('react-native/package.json')]})"
  ].execute(null, settingsDir).text.trim()).parent)
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'FabricExample'
include ':app'
includeBuild(new File(["node", "--print",
    "require.resolve('@react-native/gradle-plugin/package.json', {paths: [require.resolve('react-native/package.json')]})"
].execute(null, settingsDir).text.trim()).parent)
